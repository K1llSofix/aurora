plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	runs {
		client {
			programArgs '--username', 'AuroraDev'
			// ./gradlew runClient -PquickPlay=host:port joins a server right away (an unreachable
			// one shows the disconnect screen).
			if (project.hasProperty('quickPlay')) {
				programArgs '--quickPlayMultiplayer', project.property('quickPlay')
			}
			// -PquickPlayWorld="New World" opens a singleplayer world from run/saves.
			if (project.hasProperty('quickPlayWorld')) {
				programArgs '--quickPlaySingleplayer', project.property('quickPlayWorld')
			}
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

jar {
	// The license goes into the jar too, as Modrinth and CurseForge expect.
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
